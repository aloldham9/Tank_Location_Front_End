<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Stop Setup</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0fdf4;
            color: #166534;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { font-size: 1.3rem; margin-top: 0; text-align: center; color: #14532d; }
        p { font-size: 0.85rem; color: #4b5563; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 5px; }
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: #22c55e; }
        .gps-box {
            background: #f9fafb;
            border: 1px dashed #d1d5db;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #4b5563;
            margin-bottom: 15px;
            text-align: center;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
            border: none;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn-primary {
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .btn-primary:active { background: #16a34a; }
        #status { font-size: 0.85rem; text-align: center; margin-top: 10px; color: #16a34a; }
    </style>
</head>
<body>

<div class="card">
    <h1>🔧 Service Stop Setup</h1>
    <p>Capture site details and exact GPS location.</p>
    
    <div class="form-group">
        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" placeholder="e.g., Jane Doe">
    </div>

    <div class="form-group">
        <label for="companyName">Company Name</label>
        <input type="text" id="companyName" placeholder="e.g., Acme Corp">
    </div>

    <div class="form-group">
        <label for="tankLocation">Tank Name / Location Name</label>
        <input type="text" id="tankLocation" placeholder="e.g., North Tank #3">
    </div>
    
    <div class="form-group">
        <label for="customerPhone">Customer Phone Number</label>
        <input type="tel" id="customerPhone" placeholder="e.g., 555-0199">
    </div>

    <div class="form-group">
        <label>Current Location</label>
        <div class="gps-box" id="gpsDisplay">GPS coordinates not captured yet.</div>
        <button class="btn-secondary" onclick="getLocation()">📍 Get Current GPS Location</button>
    </div>

    <button class="btn-primary" onclick="submitData()">Save & Send to Office</button>
    <div id="status"></div>
</div>

<script>
    let currentLat = "";
    let currentLon = "";

    function getLocation() {
        const display = document.getElementById('gpsDisplay');
        if (!navigator.geolocation) {
            display.innerText = "Geolocation is not supported by your browser.";
            return;
        }
        
        display.innerText = "Locating GPS coordinates...";
        navigator.geolocation.getCurrentPosition(
            (position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;
                display.innerText = `Lat: ${currentLat.toFixed(5)}, Lon: ${currentLon.toFixed(5)}`;
            },
            (error) => {
                display.innerText = "Unable to retrieve your location. Check permissions.";
            }
        );
    }

    function submitData() {
        const customerName = document.getElementById('customerName').value.trim();
        const companyName = document.getElementById('companyName').value.trim();
        const tankLocation = document.getElementById('tankLocation').value.trim();
        const customerPhone = document.getElementById('customerPhone').value.trim();
        const status = document.getElementById('status');

        if (!customerName || !customerPhone || !tankLocation) {
            alert('Please fill out the required fields (Customer Name, Phone, and Tank/Location).');
            return;
        }

        if (!currentLat || !currentLon) {
            alert('Please capture the GPS location first.');
            return;
        }

        status.innerText = "Saving data...";

        // REPLACE THIS URL with your actual Google Apps Script Web App URL
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        const data = { 
            customerName: customerName, 
            companyName: companyName, 
            tankLocation: tankLocation, 
            customerPhone: customerPhone, 
            lat: currentLat, 
            lon: currentLon 
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            status.innerText = "Successfully saved! Office updated.";
            document.getElementById('customerName').value = '';
            document.getElementById('companyName').value = '';
            document.getElementById('tankLocation').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('gpsDisplay').innerText = "GPS coordinates not captured yet.";
            currentLat = "";
            currentLon = "";
        })
        .catch((error) => {
            status.innerText = "Error saving data. Try again.";
            console.error('Error!', error.message);
        });
    }
</script>

</body>
</html>
